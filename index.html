<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- app-assinaturas-cursos -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minhas Assinaturas e Cursos</title>
<style>
:root{--bg:#e3effc;--card:#fff;--ink:#14213a;--mut:#5d6f8c;--line:#cfdff3;--pri:#2f6fe4;--pri2:#dce9fd;--ok:#1f9d6b;--warn:#d98a00;--bad:#d64545}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1520;--card:#172033;--ink:#eaf1ff;--mut:#9fb0cc;--line:#26324a;--pri:#6ea8ff;--pri2:#1f2d4a;--ok:#4cc99a;--warn:#f0b43c;--bad:#ff7a7a}}
:root[data-theme="dark"]{--bg:#0f1520;--card:#172033;--ink:#eaf1ff;--mut:#9fb0cc;--line:#26324a;--pri:#6ea8ff;--pri2:#1f2d4a;--ok:#4cc99a;--warn:#f0b43c;--bad:#ff7a7a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:16px;padding-bottom:100px}
.wrap{max-width:820px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:21px;margin:4px 0 14px}
#theme{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--card);padding:5px;border-radius:14px;border:1px solid var(--line);margin-bottom:14px;position:sticky;top:8px;z-index:5}
.tabs button{flex:1;border:0;background:none;padding:10px 2px;border-radius:10px;color:var(--mut);font-weight:600;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--pri);color:#fff}
.btn.p,.fab{color:#fff}
:root[data-theme="dark"] .btn.p,:root[data-theme="dark"] .tabs button.on,:root[data-theme="dark"] .fab{color:#0b1220}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.p,:root:not([data-theme="light"]) .tabs button.on,:root:not([data-theme="light"]) .fab{color:#0b1220}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat small{color:var(--mut);font-size:12px}.stat b{display:block;font-size:20px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lft{display:flex;gap:11px;min-width:0;align-items:flex-start}
.ico{width:46px;height:46px;border-radius:12px;background:var(--pri2);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:21px;position:relative;overflow:hidden;flex:none}
.ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:5px}
.name{font-weight:700;font-size:16px;word-break:break-word}.sub{color:var(--mut);font-size:13px;margin-top:3px}
.price{font-weight:700;white-space:nowrap}
.chip{display:inline-block;font-size:11px;padding:3px 8px;border-radius:99px;background:var(--pri2);color:var(--pri);font-weight:600;margin-right:4px;margin-top:6px}
.chip.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.bar{height:8px;background:var(--pri2);border-radius:99px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--pri)}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:10px;font-size:13px;cursor:pointer;font-weight:600}
.btn.p{background:var(--pri);border-color:var(--pri)}.btn.d{color:var(--bad)}
#fabs{position:fixed;right:16px;bottom:16px;display:flex;gap:8px;z-index:6}
.fab{background:var(--pri);border:0;border-radius:99px;padding:14px 18px;font-weight:700;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
select,input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
.tools select,.tools input{width:auto;flex:1;min-width:120px}
.modal{position:fixed;inset:0;background:rgba(8,12,25,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin:0 0 12px;font-size:18px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.icoRow{display:flex;gap:12px;align-items:center}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
h3{font-size:15px;margin:18px 0 8px}
.cat{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.cat span.l{width:100px;color:var(--mut)}.cat .bar{flex:1;margin:0}
#st{font-size:11px;color:var(--mut);text-align:right;margin-top:6px}
.card{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.card.picked{outline:2.5px solid var(--pri);outline-offset:-1px}
.chk{position:absolute;right:12px;bottom:8px;font-size:28px;line-height:1;color:var(--pri)}
.selmode .card{padding-bottom:44px}
.selmode .acts{display:none}
.fab2{background:var(--card);color:var(--ink);border:1px solid var(--line)}
:root[data-theme="dark"] .fab2{color:var(--ink)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .fab2{color:var(--ink)}}
#snack{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:calc(100% - 32px);max-width:520px;background:#1d2740;color:#fff;padding:8px 8px 8px 16px;border-radius:14px;display:none;justify-content:space-between;align-items:center;gap:12px;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:14px}
#snack.on{display:flex}
#snack button{background:none;border:0;color:#9CCBFF;font-weight:800;font-size:14px;padding:10px 12px;cursor:pointer}
.imp .two{margin-top:8px}.imp input,.imp select{margin-top:6px}
.imp label.inc{display:flex;gap:8px;align-items:center;margin:0;color:var(--ink);font-size:13px}.imp label.inc input{width:auto;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>📋 Assinaturas e Cursos</h1><button id="theme" onclick="cycleTheme()"></button></div>
  <div class="tabs">
    <button data-t="res" class="on">Resumo</button>
    <button data-t="sub">Assinaturas</button>
    <button data-t="cur">Cursos</button>
    <button data-t="des">Desejos</button>
  </div>
  <div id="view"></div>
  <div id="st"></div>
</div>
<div id="fabs"></div>
<div id="snack"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const CATS0=["Streaming","Estudos","Música","Software","Saúde","Compras","Jogos","Outros"];
function cats(){const o=(Array.isArray(S.cats)?S.cats:CATS0).slice();S.subs.forEach(s=>{if(s.categoria&&o.indexOf(s.categoria)<0)o.push(s.categoria)});return o}
function setCats(l){S.cats=l;S.catsU=Date.now();save()}
const CICLOS={mensal:1,trimestral:3,semestral:6,anual:12};
const KEY={sub:"subs",cur:"cursos",des:"desejos"};
const MARCAS={netflix:"netflix.com",spotify:"spotify.com",youtube:"youtube.com",prime:"primevideo.com",amazon:"amazon.com.br",disney:"disneyplus.com",hbo:"max.com",max:"max.com",globoplay:"globoplay.globo.com",canva:"canva.com",chatgpt:"openai.com",openai:"openai.com",claude:"claude.ai",gemini:"gemini.google.com",notion:"notion.so",google:"google.com",icloud:"icloud.com",apple:"apple.com",duolingo:"duolingo.com",udemy:"udemy.com",hotmart:"hotmart.com",coursera:"coursera.org",alura:"alura.com.br",microsoft:"microsoft.com",office:"microsoft.com",adobe:"adobe.com",dropbox:"dropbox.com",deezer:"deezer.com",github:"github.com",linkedin:"linkedin.com",kiwify:"kiwify.com.br",eduzz:"eduzz.com",sanar:"sanarflix.com.br",sanarflix:"sanarflix.com.br",medcel:"medcel.com.br",medway:"medway.com.br",medgrupo:"medgrupo.com.br",amboss:"amboss.com",uptodate:"uptodate.com",anki:"ankiweb.net",ankihub:"ankihub.net",paramount:"paramountplus.com",crunchyroll:"crunchyroll.com",tidal:"tidal.com",picsart:"picsart.com",capcut:"capcut.com",grammarly:"grammarly.com",skillshare:"skillshare.com",masterclass:"masterclass.com",domestika:"domestika.org",instagram:"instagram.com",meta:"meta.com",truecaller:"truecaller.com",evernote:"evernote.com",life360:"life360.com",whatsapp:"whatsapp.com",tiktok:"tiktok.com",twitch:"twitch.tv",discord:"discord.com",zoom:"zoom.us",slack:"slack.com"};
const brl=v=>(Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const parse=s=>{if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmt=d=>d?d.toLocaleDateString("pt-BR"):"—";
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const days=d=>Math.round((d-today())/864e5);
const addM=(d,n)=>{const r=new Date(d.getFullYear(),d.getMonth()+n,1);const last=new Date(r.getFullYear(),r.getMonth()+1,0).getDate();r.setDate(Math.min(d.getDate(),last));return r};

let S={subs:[],cursos:[],desejos:[],tema:"auto"},tab="res",filt={q:"",cat:"",st:""};
let dbDoc=null,saveT=null,tmpIcone="";
let selMode=false,sel=new Set(),vis=[],snackT=null,lpT=null,lpFired=false,lpUp=0,lpX=0,lpY=0,impRows=null,impBusy=false,impErr="",impK="sub",impDup=null;
const base=o=>Object.assign({subs:[],cursos:[],desejos:[],tema:"auto"},o||{});

/* ---------- logos ---------- */
function dominios(it){
  if(it.link){try{return [new URL(/^https?:\/\//i.test(it.link)?it.link:"https://"+it.link).hostname]}catch(e){}}
  const n=(it.nome||"").toLowerCase();
  for(const k in MARCAS){if(new RegExp("\\b"+k+"\\b").test(n))return [MARCAS[k]]}
  const base=n.normalize("NFD").replace(/[̀-ͯ]/g,"").split(/\s[-–—]\s|:|\(|\sby\s|\||,/)[0].trim();
  const p=base.split(/\s+/)[0].replace(/[^a-z0-9]/g,"");
  return p.length>=3?[p+".com",p+".com.br"]:[];
}
function logoUrls(it){
  const u=[];
  dominios(it).forEach(d=>{
    u.push("https://www.google.com/s2/favicons?domain="+encodeURIComponent(d)+"&sz=128");
    u.push("https://icons.duckduckgo.com/ip3/"+encodeURIComponent(d)+".ico");
  });
  return u;
}
function logoNext(img){
  const u=JSON.parse(img.dataset.u),i=+img.dataset.i+1;
  if(i>=u.length){img.remove();return}
  img.dataset.i=i;img.src=u[i];
}
function logoOk(img){
  const u=JSON.parse(img.dataset.u)[+img.dataset.i];
  if(u.indexOf("google.com/s2")>=0&&img.naturalWidth<32)logoNext(img);
}
function ico(it){
  const L=((it.nome||"?").trim()[0]||"?").toUpperCase();
  let img="";
  if(it.icone)img=`<img src="${it.icone}" alt="">`;
  else if(!it.emoji){
    const u=logoUrls(it);
    if(u.length)img=`<img src="${u[0]}" alt="" data-u="${esc(JSON.stringify(u))}" data-i="0" onerror="logoNext(this)" onload="logoOk(this)">`;
  }
  return `<div class="ico">${esc(it.emoji||L)}${img}</div>`;
}

/* ---------- tema ---------- */
function applyTheme(){
  const t=S.tema||"auto",r=document.documentElement;
  if(t==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t);
  const b=document.getElementById("theme");
  if(b)b.textContent=t==="auto"?"🌗 Auto":t==="light"?"☀️ Claro":"🌙 Escuro";
}
function cycleTheme(){S.tema=({auto:"light",light:"dark",dark:"auto"})[S.tema||"auto"];applyTheme();save()}

/* ---------- persistência ---------- */
const LS="assin_cursos_v1";
function lsGet(){try{return JSON.parse(localStorage.getItem(LS)||"null")}catch(e){return null}}
function lsSet(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function status(t){document.getElementById("st").textContent=t}
function save(){
  stamp();lsSet();ghSched();clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    if(!dbDoc){status("Salvo neste aparelho");return}
    try{await dbDoc.set({json:JSON.stringify(S)});status("Salvo na nuvem ✓")}catch(e){status("Salvo neste aparelho")}
  },400);
}
async function init(){
  S=base(lsGet());snapH();applyTheme();render();
  setTimeout(()=>{window.__resume&&window.__resume()},600);
  setTimeout(()=>ghSync(false),900);
  try{
    if(typeof claude==="undefined"||!claude.use)return;
    const db=await claude.use("db"),user=await claude.use("user");
    if(db&&user){
      const id=await user.id();
      dbDoc=db.collection("data/users/"+id).doc("state");
      const snap=await dbDoc.get();
      const data=snap&&(typeof snap.data==="function"?snap.data():snap);
      if(data&&data.json){mesclar(JSON.parse(data.json));applyTheme();render();status("Sincronizado ✓")}
      else if(S.subs.length||S.cursos.length||S.desejos.length){save()}
    }
  }catch(e){status("Salvo neste aparelho")}
}

/* ---------- lógica ---------- */
const mensal=s=>(Number(s.valor)||0)/(CICLOS[s.ciclo]||1);
function proxima(s){
  let d=parse(s.proxima);if(!d)return null;
  if(s.status!=="ativa")return d;
  const step=CICLOS[s.ciclo]||1;let g=0;
  while(d<today()&&g++<600)d=addM(d,step);
  return d;
}
const ativas=()=>S.subs.filter(s=>s.status==="ativa");

/* ---------- views ---------- */
function render(){
  document.body.classList.toggle("selmode",selMode);
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  document.getElementById("fabs").innerHTML=selMode?fabSel():tab==="res"?`<button class="fab" onclick="edit('sub')">+ Assinatura</button><button class="fab" onclick="edit('cur')">+ Curso</button>`
    :tab==="sub"?`<button class="fab fab2" onclick="importarPrint('sub')">📷 Print</button><button class="fab" onclick="edit('sub')">+ Assinatura</button>`
    :tab==="cur"?`<button class="fab fab2" onclick="importarPrint('cur')">📷 Print</button><button class="fab" onclick="edit('cur')">+ Curso</button>`
    :`<button class="fab fab2" onclick="importarPrint('des')">📷 Print</button><button class="fab" onclick="edit('des')">+ Desejo</button>`;
  document.getElementById("view").innerHTML=tab==="res"?vRes():tab==="sub"?vSub():tab==="cur"?vCur():vDes();
}
function vRes(){
  const a=ativas();
  const m=a.reduce((t,s)=>t+mensal(s),0);
  const inv=S.cursos.reduce((t,c)=>t+(Number(c.valor)||0),0);
  const andamento=S.cursos.filter(c=>c.status==="andamento").length;
  const des=S.desejos.reduce((t,d)=>t+(Number(d.valor)||0),0);
  const emAnd=S.cursos.filter(c=>c.status==="andamento").sort((x,y)=>(y.progresso||0)-(x.progresso||0));
  const naoIni=S.cursos.filter(c=>c.status==="naoiniciado");
  const exp=S.cursos.filter(c=>c.acesso&&c.status!=="concluido").map(c=>({c,n:days(parse(c.acesso))})).filter(x=>x.n<=60).sort((x,y)=>x.n-y.n);
  const porCat={};a.forEach(s=>porCat[s.categoria]=(porCat[s.categoria]||0)+mensal(s));
  const maxC=Math.max(1,...Object.values(porCat));
  let h=`<div class="grid">
   <div class="stat"><small>Por mês</small><b>${brl(m)}</b></div>
   <div class="stat"><small>Por ano</small><b>${brl(m*12)}</b></div>
   <div class="stat"><small>Assinaturas ativas</small><b>${a.length}</b></div>
   <div class="stat"><small>Cursos em andamento</small><b>${andamento}</b></div>
   <div class="stat"><small>Investido em cursos</small><b>${brl(inv)}</b></div>
   <div class="stat"><small>Lista de desejos (${S.desejos.length})</small><b>${brl(des)}</b></div></div>`;
  const cardEst=(c,comecar)=>{
    const n=c.acesso?days(parse(c.acesso)):null;
    return `<div class="card"><div class="row"><div class="lft">${ico(c)}<div><div class="name">${esc(c.nome)}</div>
    <div class="sub">${esc(c.plataforma||"—")} · ${c.progresso||0}% concluído</div>
    ${n!==null&&n<=30?`<span class="chip ${n<0?"bad":"warn"}">${n<0?"acesso expirado":n+" dias de acesso"}</span>`:""}</div></div>
    <div class="price">${c.progresso||0}%</div></div>
    <div class="bar"><i style="width:${c.progresso||0}%"></i></div>
    <div class="acts">${comecar?"":`<button class="btn" onclick="prog('${c.id}',-10)">−10%</button>`}<button class="btn p" onclick="prog('${c.id}',10)">${comecar?"▶ Começar":"+10%"}</button>${linkBtn(c.link)}</div></div>`;
  };
  h+=`<h3>📚 Continuar estudando</h3>`;
  if(emAnd.length)h+=emAnd.map(c=>cardEst(c,false)).join("");
  else if(naoIni.length)h+=`<div class="sub" style="margin-bottom:8px">Nenhum curso em andamento. Que tal começar um?</div>`+naoIni.slice(0,3).map(c=>cardEst(c,true)).join("");
  else h+=`<div class="empty">Nenhum curso para estudar agora.<br>Toque em “+ Curso” para cadastrar.</div>`;
  if(exp.length){h+=`<h3>⏳ Acessos de cursos expirando</h3>`+exp.map(({c,n})=>`<div class="card"><div class="row"><div class="lft">${ico(c)}<div><div class="name">${esc(c.nome)}</div><div class="sub">${n<0?"Expirou em ":"Expira em "}${fmt(parse(c.acesso))} · ${c.progresso||0}% concluído</div></div></div><span class="chip ${n<0?"bad":"warn"}">${n<0?"expirado":n+" dias"}</span></div></div>`).join("")}
  if(Object.keys(porCat).length){h+=`<h3>Gasto mensal por categoria</h3><div class="card">`+Object.entries(porCat).sort((x,y)=>y[1]-x[1]).map(([k,v])=>`<div class="cat"><span class="l">${esc(k)}</span><div class="bar"><i style="width:${v/maxC*100}%"></i></div><b>${brl(v)}</b></div>`).join("")+`</div>`}
  h+=`<h3>🔄 Sincronizar celular ↔ site</h3><div class="card"><div class="sub" style="margin-bottom:10px">Toque em <b>Copiar dados</b> aqui e em <b>Colar e mesclar</b> no outro aparelho. Os dois lados são somados e nada se perde (edições e exclusões também valem).</div><div class="acts"><button class="btn p" onclick="syncCopiar()">📤 Copiar dados</button><button class="btn p" onclick="syncColar()">📥 Colar e mesclar</button></div><div class="acts"><button class="btn" onclick="ghModal()">☁️ Sincronização automática${ghTok()?" · ativa ✓":""}</button></div>${AND?`<div class="acts"><button class="btn" onclick="syncCompartilhar()">↗ Compartilhar (WhatsApp, Drive, e-mail…)</button></div>`:""}</div><div class="acts"><button class="btn" onclick="exportar()">Copiar backup</button><button class="btn" onclick="importar()">Restaurar backup</button></div>`;
  return h;
}
function vSub(){
  const f=filt;
  let l=S.subs.filter(s=>(!f.q||s.nome.toLowerCase().includes(f.q.toLowerCase()))&&(!f.cat||s.categoria===f.cat)&&(!f.st||s.status===f.st));
  l.sort((a,b)=>(a.status==="ativa"?0:1)-(b.status==="ativa"?0:1)||((proxima(a)||8.64e15)-(proxima(b)||8.64e15)));
  vis=l.map(x=>x.id);
  let h=`<div class="tools"><input placeholder="Buscar…" value="${esc(f.q)}" oninput="filt.q=this.value;keep(this)">
  <button type="button" class="btn ${f.cat?"p":""}" onclick="catSheet()">🏷️ ${f.cat?esc(f.cat):"Categorias"}</button>
  <select onchange="filt.st=this.value;render()"><option value="">Status</option>${["ativa","pausada","cancelada"].map(c=>`<option ${f.st===c?"selected":""}>${c}</option>`).join("")}</select>${selBtn()}</div>`;
  if(!l.length)return h+`<div class="empty">Nada por aqui. Toque em “+ Assinatura”.</div>`;
  return h+l.map(s=>{
    const d=proxima(s),n=d?days(d):null;
    const cls=s.status!=="ativa"?"bad":n!==null&&n<=3?"warn":"ok";
    return `<div class="card${sel.has(s.id)?" picked":""}" data-id="${s.id}">${chk(s.id)}<div class="row"><div class="lft">${ico(s)}<div><div class="name">${esc(s.nome)}</div>

const MESES={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
const RX_PRECO=/(?:R\$|RS)\s?(\d{1,3}(?:\.\d{3})*|\d+),(\d{2})/i;
const RX_SKIP=/renova|próxima|proxima|cobran|vence|expira|a partir|desde|cancel|gerenci|total|pagamento|forma de|^plano$|^assinaturas?$|^ativas?$|^(mensal|anual|semestral|trimestral|semanal|ativo|ativa)$/i;
function catDe(n){n=(n||"").toLowerCase();
  if(/netflix|disney|hbo|\bmax\b|prime|globoplay|youtube|paramount|crunchyroll|apple tv/.test(n))return "Streaming";
  if(/spotify|deezer|tidal|apple music|amazon music/.test(n))return "Música";
  if(/duolingo|alura|udemy|coursera|medcel|sanar|medway|amboss|uptodate|anki|skillshare|masterclass|domestika|curso|wemeds|medicina/.test(n))return "Estudos";
  if(/canva|adobe|microsoft|office|notion|chatgpt|openai|claude|google|icloud|dropbox|github|grammarly|capcut|picsart|truecaller|evernote|life360|instagram/.test(n))return "Software";
  return "Outros"}
function mkData(d,mo,y){
  if(!(d>=1&&d<=31&&mo>=1&&mo<=12))return "";
  const t=today();
  if(!y){y=t.getFullYear();if(new Date(y,mo-1,d)<t)y++}
  const dt=new Date(y,mo-1,d);
  return dt.getMonth()===mo-1?iso(dt):"";
}
function acharData(t){
  let m=t.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
  if(m){let y=m[3]?+m[3]:null;if(y&&y<100)y+=2000;return mkData(+m[1],+m[2],y)}
  m=t.toLowerCase().match(/(\d{1,2})\s*(?:de\s*)?(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-zç]*\.?(?:\s*(?:de\s*)?(\d{4}))?/);
  if(m)return mkData(+m[1],MESES[m[2]],m[3]?+m[3]:null);
  return "";
}
function acharCiclo(t){t=t.toLowerCase();
  if(/anual|annual|\/\s*ano|por ano|a cada ano|yearly|12 meses/.test(t))return "anual";
  if(/semestral|6 meses/.test(t))return "semestral";
  if(/trimestral|3 meses/.test(t))return "trimestral";
  return "mensal"}
const RX_ANC=/pr[óo]ximo pagamento|assinatura (termina|expira|ser[áa] cancelada)|expira em/i;
const RX_STATUS=/^(cancelada|em espera|pausada|suspensa|teste gratuito|per[ií]odo de car[êe]ncia)$/i;
const RX_CAB=/^(ativo|expirou|seu plano inclui|expiradas?|assinaturas?)$/i;
function prepara(input){
  const L=[],B=[];
  if(typeof input==="string"){
    input.split("\n").forEach(x=>{const t=x.replace(/\s{2,}/g," ").trim();if(t){L.push(t);B.push(null)}});
  }else{
    (input||[]).forEach(r=>{const t=String(r.t||"").replace(/\s{2,}/g," ").trim();if(t){L.push(t);B.push({t:r.tp,b:r.b})}});
  }
  for(let i=0;i<L.length-1;i++){
    if(/\bde$/i.test(L[i])&&/^\d{4}$/.test(L[i+1])){L[i]+=" "+L[i+1];L.splice(i+1,1);B.splice(i+1,1)}
  }
  return {L,B};
}
function cicloPlay(plano,anc,data){
  const t=(plano+" "+anc).toLowerCase();
  if(/anual|annual|yearly|\/\s*ano|por ano/.test(t))return "anual";
  if(/semestral|6 meses|semiannual/.test(t))return "semestral";
  if(/trimestral|3 meses|quarterly/.test(t))return "trimestral";
  if(/mensal|monthly|\/\s*m[eê]s|por m[eê]s/.test(t))return "mensal";
  if(data){const n=days(parse(data));if(n>300)return "anual";if(n>150)return "semestral"}
  return "mensal";
}
/* Formato do Google Play: [nome do app] [plano] [Próximo pagamento: R$ ... em data] */
function parsePlay(L,B){
  const out=[];
  const ruim=x=>!x||RX_CAB.test(x)||/^[✓✔√]/.test(x)||/^\d{4}$/.test(x)||RX_ANC.test(x)||RX_PRECO.test(x)||/saiba mais|google pode|para ajudar/i.test(x)||/\bde\s\d{4}$/.test(x);
  L.forEach((l,i)=>{
    if(!RX_ANC.test(l)||i<1)return;
    let plano=L[i-1],k=i-2,status="ativa";
    if(k>=0&&RX_STATUS.test(L[k])){if(/cancelada/i.test(L[k]))status="cancelada";k--}
    let nome=k>=0?L[k]:"";
    if(ruim(nome)){nome=plano;plano="";k=i-1}
    if(ruim(nome))return;
    const pm=l.match(RX_PRECO),data=acharData(l);
    if(!pm&&status!=="cancelada")return;
    const valor=pm?parseFloat(pm[1].replace(/\./g,"")+"."+pm[2]):0;
    out.push({nome:nome.replace(/^[^A-Za-zÀ-ú0-9]+/,"").slice(0,70),valor,ciclo:cicloPlay(plano,l,data),proxima:data,
      categoria:catDe(nome),on:status==="ativa",status,nota:plano,_box:B[k]||null});
  });
  return out;
}
/* Recorta a logo de cada item direto do print (layout do Google Play: ícone à direita do nome) */
async function comLogos(rows,du,W){
  if(!rows.some(r=>r._box))return rows.map(r=>{delete r._box;return r});
  const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=du});
  rows.forEach(r=>{
    const b=r._box;delete r._box;
    if(!b)return;
    const s=Math.round(0.1463*W),cy=(b.t+b.b)/2,y0=Math.round(cy-0.0259*W),x0=Math.round(0.7917*W);
    if(y0<0||y0+s>im.height||x0+s>im.width)return;
    const c=document.createElement("canvas");c.width=c.height=128;
    const g=c.getContext("2d"),q=28,z=128;
    g.beginPath();g.moveTo(q,0);g.arcTo(z,0,z,z,q);g.arcTo(z,z,0,z,q);g.arcTo(0,z,0,0,q);g.arcTo(0,0,z,0,q);g.closePath();g.clip();
    g.drawImage(im,x0,y0,s,s,0,0,z,z);
    r.icone=c.toDataURL("image/png");
  });
  return rows;
}

function impUpd(i){const el=document.getElementById("ih"+i);if(el&&impRows[i])el.innerHTML=impHeadInner(impRows[i])}
function parsePrint(input){
  const {L,B}=prepara(input);
  const play=parsePlay(L,B);if(play.length)return play;
  const idx=[];L.forEach((l,i)=>{if(RX_PRECO.test(l))idx.push(i)});
  const out=[],vistos=new Set();
  const temLetras=x=>/[A-Za-zÀ-ú]{2,}/.test(x);
  idx.forEach((p,k)=>{
    const lp=L[p],m=lp.match(RX_PRECO);
    if(/total/i.test(lp))return;
    const a=k>0?idx[k-1]+1:0,b=k<idx.length-1?idx[k+1]-1:L.length-1;
    const ok=x=>temLetras(x)&&!RX_PRECO.test(x)&&!RX_SKIP.test(x)&&!(acharData(x)&&x.replace(/[^A-Za-zÀ-ú]/g,"").length<6);
    let nome="";
    const antes=lp.slice(0,m.index).replace(/[\/·|•–—:\-\s]+$/,"").trim();
    if(temLetras(antes)&&!RX_SKIP.test(antes))nome=antes;
    for(let i=p-1;!nome&&i>=a;i--)if(ok(L[i]))nome=L[i];
    for(let i=p+1;!nome&&i<=b;i++)if(ok(L[i]))nome=L[i];
    if(!nome)return;
    nome=nome.replace(/^[^A-Za-zÀ-ú0-9]+/,"").slice(0,60);
    const na=k>0?Math.floor((idx[k-1]+p)/2)+1:0,nb=k<idx.length-1?Math.ceil((p+idx[k+1])/2)-1:L.length-1;
    let data="";
    const ordem=[];for(let i=na;i<=nb;i++)ordem.push(i);
    ordem.sort((x,y)=>Math.abs(x-p)-Math.abs(y-p));
    for(const i of ordem){const d=acharData(L[i]);if(d){data=d;break}}
    const valor=parseFloat(m[1].replace(/\./g,"")+"."+m[2]);
    const chave=nome.toLowerCase()+valor;if(vistos.has(chave))return;vistos.add(chave);
    const win=L.slice(na,nb+1).join(" ");out.push({nome,valor,ciclo:acharCiclo(win),proxima:data,categoria:catDe(nome),on:true,rec:/\/\s*(mês|mes|ano)|mensal|anual|semestral|trimestral|por mês|por ano/i.test(win),pct:Math.min(100,+((win.match(RX_PCT)||[])[1]||0))});
  });
  return out;
}
function redim(file,max){return new Promise((res,rej)=>{
  const r=new FileReader();r.onerror=rej;

      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",0.9))};

const RX_PCT=/(\d{1,3})\s?%/;
const UI_WORDS=/^(comprar|assistir|continuar|iniciar|começar|concluíd[oa]|ver |meus cursos|cursos|home|início|inicio|buscar|pesquisar|perfil|certificado|aulas?|módulos?|favoritos|configura|voltar|ver tudo|todos|em andamento|não iniciado|login|entrar)/i;
function candidatos(texto){
  const L=texto.split("\n").map(x=>x.replace(/\s{2,}/g," ").trim()).filter(Boolean);
  const out=[],vistos=new Set();
  L.forEach((l,i)=>{
    const t=l.replace(/\d{1,3}\s?%/g,"").trim();
    if(t.length<6||!/[A-Za-zÀ-ú]{3,}/.test(t)||RX_SKIP.test(t)||UI_WORDS.test(t)||RX_PRECO.test(t))return;
    if(acharData(t)&&t.replace(/[^A-Za-zÀ-ú]/g,"").length<6)return;
    const key=t.toLowerCase();if(vistos.has(key))return;vistos.add(key);
    const near=[L[i],L[i+1]||"",L[i+2]||""].join(" ");
    out.push({nome:t.slice(0,70),valor:"",pct:Math.min(100,+((near.match(RX_PCT)||[])[1]||0)),on:false,rec:false,ciclo:"mensal"});
  });

}
function parseExtra(texto,k){

    :{nome:r.nome,valor:r.valor||"",tipo:r.rec?"assinatura":"curso",ciclo:r.ciclo||"mensal",prioridade:"media",on:r.on});
}
function promptDe(k){
  const hoje=`Hoje é ${iso(today())}; se a data não tiver ano, use a próxima data futura. Ignore menus, botões e totais. Se não houver nenhum, responda [].`;
  if(k==="cur")return `Este é um print de tela com um ou mais cursos (lista de cursos, compra, plataforma de ensino). Extraia cada curso. Responda SOMENTE com um array JSON de objetos {"nome":string,"valor":número em reais ou 0 se não houver,"progresso":número de 0 a 100 (0 se não houver),"acesso":"YYYY-MM-DD" se houver data de expiração do acesso, senão ""}. ${hoje}`;

}
function normRow(x,k){
  const nome=String(x.nome||"").trim(),valor=Number(x.valor)||0;
  const data=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||"")?v:"";
  if(k==="cur")return {nome,valor:valor||"",progresso:Math.max(0,Math.min(100,Number(x.progresso)||0)),acesso:data(x.acesso),on:true};
  if(k==="des")return {nome,valor:valor||"",tipo:x.tipo==="assinatura"?"assinatura":"curso",ciclo:CICLOS[x.ciclo]?x.ciclo:"mensal",prioridade:"media",on:true};
  return {nome,valor,ciclo:CICLOS[x.ciclo]?x.ciclo:"mensal",proxima:data(x.proxima),categoria:catDe(nome),status:x.status==="cancelada"?"cancelada":"ativa",nota:String(x.plano||"").trim(),on:x.status!=="cancelada"};
}
async function lerPrint(file){
  if(window.AndroidOCR){const du=await redim(file,2400),o=await ocrNative(du);
    if(impK==="sub")return await comLogos(parsePrint(o.rows),du,o.w);
    return parseExtra(o.rows.map(r=>r.t).join("\n"),impK)}
  const sample=(typeof claude!=="undefined"&&claude.use)?await claude.use("sample"):null;
  if(!sample)throw new Error("A leitura de print funciona no app Android.");
  const du=await redim(file,1600);
  const j=await sample.json(promptDe(impK),{images:[dataToBlob(du)]});
  return (Array.isArray(j)?j:(j&&(j.itens||j.assinaturas||j.cursos))||[]).map(x=>normRow(x,impK)).filter(x=>x.nome);
}
function importarPrint(k){impK=k||"sub";impRows=null;impBusy=false;impErr="";showImp()}
async function lerPrints(files){

let prevT=null;
function refreshPrev(){
  const g=id=>document.getElementById(id);

  const it={nome:g("f_nome")?.value||"",link:g("f_link")?.value||"",icone:tmpIcone,emoji:(g("f_emoji")?.value||"").trim()};
  const key=JSON.stringify([it.icone,it.emoji,it.emoji||it.icone?"":logoUrls(it)]);
  const tem=box.firstElementChild;
  if(tem&&box.dataset.k===key){
    // mesma imagem: só atualiza a letra, sem recarregar a logo (evita piscar)
    const L=it.emoji||((it.nome||"?").trim()[0]||"?").toUpperCase();
    if(tem.firstChild&&tem.firstChild.nodeType===3)tem.firstChild.nodeValue=L;
    return;
  }
  clearTimeout(prevT);
  const troca=()=>{box.innerHTML=ico(it);box.dataset.k=key};
  // ao digitar o nome sem link, espera parar de digitar antes de buscar outra logo
  if(box.dataset.k&&!it.icone&&!it.emoji)prevT=setTimeout(troca,500);else troca();

function gotIcon(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const s=128,c=document.createElement("canvas");c.width=c.height=s;
    const k=Math.min(s/im.width,s/im.height),w=im.width*k,h=im.height*k;
    c.getContext("2d").drawImage(im,(s-w)/2,(s-h)/2,w,h);
    tmpIcone=c.toDataURL("image/png");refreshPrev()};im.src=r.result};
  r.readAsDataURL(f);
}

    <label>Link (puxa a logo)</label><input id="f_link" value="${esc(d.link)}" placeholder="https://…" oninput="refreshPrev()">
    ${iconBlock(d)}
    <div class="two"><div><label>Tipo</label><select id="f_tipo"><option value="curso" ${d.tipo==="curso"?"selected":""}>Curso</option><option value="assinatura" ${d.tipo==="assinatura"?"selected":""}>Assinatura</option></select></div>
    <div><label>Prioridade</label><select id="f_pri">${["alta","media","baixa"].map(c=>`<option ${d.prioridade===c?"selected":""}>${c}</option>`).join("")}</select></div></div>
    <div class="two"><div><label>Preço (R$)</label><input id="f_valor" type="number" step="0.01" inputmode="decimal" value="${esc(d.valor)}"></div>
    <div><label>Cobrança (se assinatura)</label><select id="f_ciclo">${Object.keys(CICLOS).map(c=>`<option ${d.ciclo===c?"selected":""}>${c}</option>`).join("")}</select></div></div>
    <label>Observações</label><textarea id="f_nota" rows="2" placeholder="Por que quero, cupom, quando está em promoção…">${esc(d.nota)}</textarea>${btns}`);
    refreshPrev();
    ok.onclick=()=>{const nome=f_nome.value.trim();if(!nome){faltou(f_nome,"Preencha o nome.");return}
      finish("des",Object.assign({id:d.id||uid(),nome,tipo:f_tipo.value,prioridade:f_pri.value,valor:parseFloat(f_valor.value)||0,ciclo:f_ciclo.value,nota:f_nota.value.trim()},common()),null)};
  }
}
/* ---------- sincronização (celular ↔ site) ---------- */
const LISTAS=["subs","cursos","desejos"];
let lastH={};
const hItem=it=>JSON.stringify(it);
const nn=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
function snapH(){S.meta=S.meta||{};S.del=S.del||{};lastH={};LISTAS.forEach(k=>S[k].forEach(it=>{lastH[it.id]=hItem(it);if(S.meta[it.id]==null)S.meta[it.id]=1}))}
function stamp(){
  S.meta=S.meta||{};S.del=S.del||{};const now=Date.now(),seen={};
  LISTAS.forEach(k=>S[k].forEach(it=>{seen[it.id]=1;
    if(lastH[it.id]!==hItem(it)){S.meta[it.id]=now;delete S.del[it.id];lastH[it.id]=hItem(it)}
    else if(S.meta[it.id]==null)S.meta[it.id]=1;
  }));
  Object.keys(lastH).forEach(id=>{if(!seen[id]){S.del[id]=now;delete S.meta[id];delete lastH[id]}});
}
function mesclar(R){
  R=base(R);const rm=R.meta||{},rd=R.del||{};S.meta=S.meta||{};S.del=S.del||{};
  let add=0,upd=0,rem=0;
  if(Array.isArray(R.cats)&&(R.catsU||0)>(S.catsU||0)){S.cats=R.cats.slice();S.catsU=R.catsU}
  for(const id in rd){if(!(S.del[id]>=rd[id]))S.del[id]=rd[id]}
  LISTAS.forEach(k=>{
    const loc=S[k];
    (R[k]||[]).forEach(ri=>{
      if(!ri||!ri.id)return;
      const ru=rm[ri.id]||0;
      if((S.del[ri.id]||0)>ru)return;
      let li=loc.find(x=>x.id===ri.id);
      if(!li){const dn=loc.find(x=>nn(x.nome)&&nn(x.nome)===nn(ri.nome));if(dn)li=dn}
      if(!li){loc.push(ri);S.meta[ri.id]=ru;add++;return}
      const lu=S.meta[li.id]||0;
      if(ru>lu){
        const novo=Object.assign({},ri);
        if(!novo.icone&&li.icone)novo.icone=li.icone;
        if(li.id!==ri.id){S.del[li.id]=Date.now();delete S.meta[li.id]}
        loc[loc.indexOf(li)]=novo;S.meta[novo.id]=ru;
        if(hItem(novo)!==hItem(li))upd++;
      }else if(li.id!==ri.id){S.del[ri.id]=Date.now()}
    });
    const antes=loc.length;
    S[k]=loc.filter(x=>!((S.del[x.id]||0)>(S.meta[x.id]||0)));
    rem+=antes-S[k].length;
  });
  snapH();save();
  return {add,upd,rem};
}
const b64=u8=>{let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function codificar(o){
  const j=JSON.stringify(o);
  if(typeof CompressionStream!=="undefined"){try{
    const cs=new Blob([j]).stream().pipeThrough(new CompressionStream("gzip"));
    return "AC1:"+b64(new Uint8Array(await new Response(cs).arrayBuffer()));
  }catch(e){}}
  return "AC0:"+b64(new TextEncoder().encode(j));
}
async function decodificar(t){
  t=String(t||"").trim();
  if(t[0]==="{")return JSON.parse(t);
  const m=t.match(/AC([01]):([A-Za-z0-9+/=\s]+)/);if(!m)throw 0;
  const u8=unb64(m[2].replace(/\s+/g,""));
  if(m[1]==="0")return JSON.parse(new TextDecoder().decode(u8));
  const ds=new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(ds).text());
}
const eCodigo=t=>/AC[01]:[A-Za-z0-9+/=]{20,}/.test(String(t||"").replace(/\s+/g,""))||/^\s*\{"subs"/.test(String(t||""));
const hStr=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return s.length+"-"+h};
const AND=typeof AndroidSync!=="undefined"?AndroidSync:null;
async function lerClip(){
  try{if(AND)return AND.ler()||""}catch(e){}
  try{return await navigator.clipboard.readText()}catch(e){return ""}
}
async function escreverClip(t){
  try{if(AND){AND.copiar(t);return true}}catch(e){}
  try{await navigator.clipboard.writeText(t);return true}catch(e){return false}
}
function resumoMescla(r){
  const p=[];if(r.add)p.push(r.add+(r.add>1?" novos":" novo"));if(r.upd)p.push(r.upd+(r.upd>1?" atualizados":" atualizado"));if(r.rem)p.push(r.rem+(r.rem>1?" removidos":" removido"));
  return p.length?"Sincronizado ✓ "+p.join(" · "):"Já estava tudo igual ✓";
}
async function aplicarCodigo(t){
  const o=await decodificar(t);
  if(!o||!Array.isArray(o.subs)||!Array.isArray(o.cursos))throw 0;
  try{localStorage.setItem("ac_sync_last",hStr(String(t).trim()))}catch(e){}
  const r=mesclar(o);closeModal();render();
  document.getElementById("snack").classList.remove("on");
  const el=document.getElementById("snack");el.innerHTML=`<span>${esc(resumoMescla(r))}</span>`;el.classList.add("on");clearTimeout(snackT);snackT=setTimeout(()=>el.classList.remove("on"),4000);
}
async function syncCopiar(){
  const c=await codificar(S);
  try{localStorage.setItem("ac_sync_last",hStr(c))}catch(e){}
  if(await escreverClip(c)){toast("Dados copiados ✓ Agora cole no outro aparelho")}
  else{openModal(`<h2>Copiar dados</h2><p class="sub">Toque no texto, selecione tudo e copie. Depois cole no outro aparelho em “Colar e mesclar”.</p><textarea id="bk" rows="6" readonly onclick="this.select()">${esc(c)}</textarea><div class="acts"><button class="btn" onclick="closeModal()">Fechar</button></div>`);bk.select()}
}
async function syncCompartilhar(){
  const c=await codificar(S);
  try{localStorage.setItem("ac_sync_last",hStr(c))}catch(e){}
  try{if(AND&&AND.compartilhar(c))return}catch(e){}
  toast("Muito grande para compartilhar — use “Copiar dados”");
}
async function syncColar(){
  const t=await lerClip();
  if(eCodigo(t)){try{await aplicarCodigo(t);return}catch(e){}}
  openModal(`<h2>Colar e mesclar</h2><p class="sub">Cole aqui os dados copiados no outro aparelho. Eles são <b>somados</b> aos que você já tem (nada é apagado).</p><textarea id="bk" rows="6" placeholder="Cole aqui…"></textarea><div class="acts"><button class="btn p" id="rs">Mesclar</button><button class="btn" onclick="closeModal()">Cancelar</button></div>`);
  rs.onclick=async()=>{try{await aplicarCodigo(bk.value)}catch(e){bk.style.borderColor="var(--bad)";toast("Não reconheci esses dados")}};
}
async function __resume(){
  ghSync(false);
  try{
    if(document.getElementById("modal").classList.contains("on"))return;
    const t=await lerClip();if(!eCodigo(t))return;
    const h=hStr(String(t).trim());let last="";try{last=localStorage.getItem("ac_sync_last")||""}catch(e){}
    if(h===last)return;
    try{localStorage.setItem("ac_sync_last",h)}catch(e){}
    window.__pend=t;
    openModal(`<h2>🔄 Dados de outro aparelho</h2><p class="sub">Encontrei dados do app copiados. Quer mesclar com os que estão aqui? Nada é apagado.</p><div class="acts"><button class="btn p" id="rs">Mesclar agora</button><button class="btn" onclick="closeModal()">Agora não</button></div>`);
    rs.onclick=async()=>{try{await aplicarCodigo(window.__pend)}catch(e){closeModal();toast("Não consegui ler os dados")}};
  }catch(e){}
}
window.__resume=__resume;
/* ---------- sincronização automática (gist privado do GitHub) ---------- */
const GH_DESC="assinaturas-cursos-sync",GH_FILE="dados.txt";
const ghTok=()=>{try{return localStorage.getItem("ac_gh_token")||""}catch(e){return ""}};
let ghBusy=false,ghAgain=false,ghIn=false,ghT=null;
function ghSched(){if(ghIn||!ghTok())return;clearTimeout(ghT);ghT=setTimeout(()=>ghSync(false),4000)}
async function gh(path,opt){
  const r=await fetch("https://api.github.com"+path,Object.assign({},opt,{headers:Object.assign({"Authorization":"Bearer "+ghTok(),"Accept":"application/vnd.github+json"},(opt&&opt.headers)||{})}));
  if(!r.ok){const e=new Error("http "+r.status);e.status=r.status;throw e}
  return r.json();
}
async function ghAchar(){
  let id="";try{id=localStorage.getItem("ac_gist_id")||""}catch(e){}
  if(id)return id;
  for(let p=1;p<=5;p++){
    const l=await gh("/gists?per_page=100&page="+p);
    const g=l.find(x=>x.description===GH_DESC&&x.files&&x.files[GH_FILE]);
    if(g){id=g.id;break}
    if(l.length<100)break;
  }
  if(!id){const g=await gh("/gists",{method:"POST",body:JSON.stringify({description:GH_DESC,public:false,files:{[GH_FILE]:{content:await codificar(S)}}})});id=g.id}
  try{localStorage.setItem("ac_gist_id",id)}catch(e){}
  return id;
}
function canon(o){
  const r={};LISTAS.forEach(k=>{r[k]=(o[k]||[]).slice().sort((a,b)=>String(a.id)<String(b.id)?-1:1)});r.meta=o.meta||{};r.del=o.del||{};r.cats=o.cats||null;r.catsU=o.catsU||0;
  return JSON.stringify(r,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
}
async function ghSync(manual){
  if(!ghTok())return;
  if(ghBusy){ghAgain=true;return}
  ghBusy=true;ghIn=true;let res=null,msg="";
  try{
    status("☁️ Sincronizando…");
    const id=await ghAchar();
    const g=await gh("/gists/"+id);
    const f=g.files&&g.files[GH_FILE];
    let remote=null;
    if(f){let txt=f.content;if(f.truncated&&f.raw_url)txt=await (await fetch(f.raw_url)).text();
      if(txt&&eCodigo(txt)){try{remote=await decodificar(txt)}catch(e){}}}
    if(remote&&Array.isArray(remote.subs)){res=mesclar(remote);render()}
    if(!remote||canon(remote)!==canon(S)){
      await gh("/gists/"+id,{method:"PATCH",body:JSON.stringify({files:{[GH_FILE]:{content:await codificar(S)}}})});
    }
    const h=new Date();status("☁️ Sincronizado "+String(h.getHours()).padStart(2,"0")+":"+String(h.getMinutes()).padStart(2,"0"));
    msg=res?resumoMescla(res):"Sincronizado ✓";
  }catch(e){
    if(e&&e.status===401){msg="Token inválido ou vencido. Gere outro em ☁️ Sincronização automática.";status("☁️ Token inválido")}
    else if(e&&e.status===404){try{localStorage.removeItem("ac_gist_id")}catch(x){}msg="Não achei os dados na nuvem. Tente de novo.";status("☁️ Tente de novo")}
    else{msg="Sem conexão. Seus dados estão salvos neste aparelho.";status("Salvo neste aparelho")}
  }
  ghBusy=false;ghIn=false;
  if(manual)toast(msg);
  if(ghAgain){ghAgain=false;setTimeout(()=>ghSync(false),500)}
}
function ghModal(){
  if(ghTok()){
    openModal(`<h2>☁️ Sincronização automática</h2><p class="sub">Ativa neste aparelho. Os dados são enviados e recebidos sozinhos do seu GitHub (gist privado), sem você copiar nada.</p><div class="acts"><button class="btn p" id="gn">Sincronizar agora</button><button class="btn" id="gd">Desativar aqui</button><button class="btn" onclick="closeModal()">Fechar</button></div>`);
    gn.onclick=()=>{closeModal();ghSync(true)};
    gd.onclick=()=>{try{localStorage.removeItem("ac_gh_token");localStorage.removeItem("ac_gist_id")}catch(e){}closeModal();toast("Desativado neste aparelho");render()};
    return;
  }
  openModal(`<h2>☁️ Sincronização automática</h2><p class="sub">Faça uma vez em cada aparelho (celular e site):</p><p class="sub"><b>1)</b> Toque em <a href="https://github.com/settings/tokens/new?description=Assinaturas%20e%20Cursos&scopes=gist" target="_blank" rel="noopener"><b>Criar token no GitHub</b></a>. Em “Expiration” escolha <b>No expiration</b>, role até o fim e toque em <b>Generate token</b>.<br><b>2)</b> Copie o token (começa com <b>ghp_</b>).<br><b>3)</b> Volte aqui, cole abaixo e toque em Ativar.</p><input id="gt" type="password" placeholder="Cole o token aqui" autocomplete="off"><div class="acts"><button class="btn p" id="ga">Ativar</button><button class="btn" onclick="closeModal()">Cancelar</button></div>`);
  ga.onclick=async()=>{
    const t=gt.value.trim();if(!t){gt.focus();return}
    try{localStorage.setItem("ac_gh_token",t)}catch(e){}
    try{await gh("/gists?per_page=1");closeModal();render();ghSync(true)}
    catch(e){try{localStorage.removeItem("ac_gh_token")}catch(x){}gt.style.borderColor="var(--bad)";toast(e&&e.status===401?"Token não aceito. Confira se copiou inteiro.":"Não consegui conectar. Verifique a internet.")}
  };
}
function ghVis(){if(document.visibilityState==="visible")ghSync(false)}
document.addEventListener("visibilitychange",ghVis);
setInterval(()=>{if(document.visibilityState==="visible")ghSync(false)},90000);
function exportar(){
  const t=JSON.stringify(S);
  openModal(`<h2>Backup</h2><p class="sub">Copie e guarde esse texto. Para restaurar, use “Restaurar backup”.</p><textarea id="bk" rows="6" readonly>${esc(t)}</textarea><div class="acts"><button class="btn p" id="cp">Copiar</button><button class="btn" onclick="closeModal()">Fechar</button></div>`);
  cp.onclick=async()=>{try{await navigator.clipboard.writeText(t);cp.textContent="Copiado ✓"}catch(e){bk.select()}};
}
function importar(){
  openModal(`<h2>Restaurar backup</h2><p class="sub">Cole o texto do backup. Isso substitui os dados atuais.</p><textarea id="bk" rows="6"></textarea><div class="acts"><button class="btn p" id="rs">Restaurar</button><button class="btn" onclick="closeModal()">Cancelar</button></div>`);
  rs.onclick=()=>{try{const o=JSON.parse(bk.value);if(!Array.isArray(o.subs)||!Array.isArray(o.cursos))throw 0;S=base(o);save();applyTheme();closeModal();render()}catch(e){bk.style.borderColor="var(--bad)"}};
}
init();
</script>
